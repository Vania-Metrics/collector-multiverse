# Métriques Multiverse : inventaire des mondes, chargés ou non.
#
# UN JAR, UNE INTÉGRATION. Le retirer retire ces métriques et rien d'autre ; s'il
# plante, il plante seul. C'est ce que « depend » rend vrai : sans le noyau ou sans
# Multiverse-Core, Bukkit ne charge pas ce plugin et le dit clairement, au lieu
# de laisser un collecteur échouer en silence à chaque scrape.
name: VaniaMetrics-Multiverse
version: ${version}
main: fr.samflix.vaniametrics.module.multiverse.MultiversePaper
api-version: '1.21'
authors: [mc-vania]
description: "Métriques Multiverse : inventaire des mondes, chargés ou non."
depend: [VaniaMetrics, Multiverse-Core]
