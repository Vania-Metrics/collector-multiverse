# Multiverse metrics: inventory of worlds, loaded or not.
#
# One jar, one integration. Removing it removes these metrics and nothing else;
# if it crashes, it crashes alone. That's what "depend" guarantees: without the
# core or without Multiverse-Core, Bukkit won't load this plugin, and says so
# clearly, instead of letting a collector fail silently on every scrape.
name: VaniaMetrics-Multiverse
version: ${version}
main: fr.samflix.vaniametrics.module.multiverse.MultiversePaper
api-version: '1.21'
authors: [mc-vania]
description: "Multiverse metrics: inventory of worlds, loaded or not."
depend: [VaniaMetrics, Multiverse-Core]
